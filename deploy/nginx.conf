map "$request_method:$uri" $statusdeck_login_limit_key {
    default "";
    "POST:/api/v1/session" $binary_remote_addr;
}

limit_req_zone $statusdeck_login_limit_key zone=statusdeck_login:10m rate=5r/m;

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $statusdeck_backend backend:8080;

    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 256k;

    location /api/ {
        limit_req zone=statusdeck_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://$statusdeck_backend;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health/live {
        proxy_pass http://$statusdeck_backend;
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /health/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
