[package]
name = "statusdeck-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "StatusDeck provider-reported status aggregator backend"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
hex = "0.4"
hmac = "0.12"
html2text = { version = "0.17", default-features = false }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
openidconnect = { version = "4.0.1", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.16", features = ["serde", "v4"] }
zeroize = "1.8"
